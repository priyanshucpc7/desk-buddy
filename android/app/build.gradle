plugins {
    id 'com.android.application'
}

android {
    namespace 'com.deskbuddy.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.deskbuddy.app"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.3.0"
    }

    buildTypes {
        debug {
            // signed with the debug key so it can be sideloaded straight away
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}
