plugins {
    id 'com.android.application'
}

// CI supplies these; local builds fall back to the debug key.
def dbStorePath = System.getenv("DB_KEYSTORE")
def dbStorePassword = System.getenv("DB_KEYSTORE_PASSWORD")
def dbKeyAlias = System.getenv("DB_KEY_ALIAS") ?: "deskbuddy"
def dbKeyPassword = System.getenv("DB_KEY_PASSWORD") ?: dbStorePassword
def dbVersionCode = (System.getenv("DB_VERSION_CODE") ?: "3").toInteger()

android {
    namespace 'com.deskbuddy.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.deskbuddy.app"
        minSdk 21
        targetSdk 34
        versionCode dbVersionCode
        versionName "1.4.1"
    }

    signingConfigs {
        if (dbStorePath) {
            release {
                storeFile file(dbStorePath)
                storePassword dbStorePassword
                keyAlias dbKeyAlias
                keyPassword dbKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            // If the release key is present, debug builds are signed with it too,
            // so either APK updates cleanly over the other.
            if (dbStorePath) signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            if (dbStorePath) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}
